name: teste-ia

# Disparo manual para verificar a triagem dentro do Actions:
# - as regras determinísticas rodam sempre (sem depender de segredo);
# - o classificador (Anthropic) só é testado se ANTHROPIC_API_KEY existir.
# (O GitHub Models, usado até 29.7.2026, foi aposentado em 30.7.2026.)
on: workflow_dispatch

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt pytest

      - name: Regras determinísticas (casos de controle)
        run: python -m pytest tests/ -v

      - name: Classificador Anthropic (se houver secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          from radar import classificador

          if not classificador.disponivel():
              print("ANTHROPIC_API_KEY ausente — radar operando só com regras (fail-closed).")
              raise SystemExit(0)

          veredito = classificador.classificar(
              "Título: Prefeitura de Exemplo/PR abre concurso público com 5 vagas "
              "para Fiscal de Tributos\n"
              "Trecho: inscrições de 10/08 a 10/09/2026 no site da banca."
          )
          print("veredito:", veredito)
          assert veredito["classe"] == "abertura", veredito
          assert veredito["area"] == "tributario", veredito
          print("classificador OK")
          EOF
