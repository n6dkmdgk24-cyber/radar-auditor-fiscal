name: teste-triagem

# Disparo manual: roda a suíte de regressão da triagem (regras +
# verificador, sem IA e sem depender de segredo nenhum).
on: workflow_dispatch

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests/ -v
