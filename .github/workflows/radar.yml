name: radar

on:
  schedule:
    # 4×/dia (cron do GitHub é UTC): 8h, 12h, 16h e 20h de Brasília.
    # O feed do CNB guarda ~15 itens/6h; com 2 execuções/dia havia janela
    # para notícia rolar para fora do feed sem ser coletada.
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          EMAIL_DE: ${{ secrets.EMAIL_DE }}
        run: python -m radar.main

      - name: Commit do estado e do painel
        if: always()
        run: |
          git config user.name 'radar-bot'
          git config user.email 'radar-bot@users.noreply.github.com'
          git add data docs
          git diff --cached --quiet || git commit -m "radar: atualização automática"
          git pull --rebase origin main
          git push
