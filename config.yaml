# Radar de concursos — Auditor Fiscal (federal, estadual, municipal)
# Termos casados após normalização (minúsculas, sem acento); espaço também casa hífen,
# então "auditor fiscal" cobre "Auditor-Fiscal".

janela_inicial_dias: 3      # primeira execução (sem cursor) olha esse período para trás
expira_vistos_dias: 180     # depois disso, o mesmo ente+categoria pode alertar de novo
painel_dias: 60             # o painel exibe descobertas desse período
pendentes_expira_dias: 30   # item sem veredito de IA expira da fila após esse prazo

fontes:
  qd: true                  # Querido Diário (diários oficiais municipais)
  pci: true                 # PCI Concursos (sitemap de notícias)
  cnb: true                 # Concursos no Brasil (RSS)
  dou: true                 # DOU Seção 3 (busca in.gov.br)
  sigpub: true              # Diários Oficiais dos Municípios via SIGPub (ver sigpub_bases)
  domsc: true               # Diário Oficial dos Municípios de SC (DOM/SC)
  selecao: true             # bancas na plataforma selecao.net.br (AOCP, IDECAN...)
  gran: true                # Gran Cursos (RSS) — 17 de 170 notícias/3 dias no alvo
  estrategia: true          # Estratégia Concursos (RSS) — cobertura baixa, mas traz o PDF do edital
  fafipa: true              # Fundação FAFIPA (banca do PR) — link direto do edital
  ibam: true                # IBAM (RJ) e IBAM-SP — link direto do edital

# Bases do SIGPub verificadas ao vivo em 13.8.2026 (respondem E têm resultado).
# Ficaram de fora: ms, appm, amurc e "bahia" (respondem 200 mas devolvem zero
# registro), aemerj e maceio (não verificadas). Atenção: "fgm" é de GOIÁS,
# apesar da sigla — conferido no dropdown de municípios da própria base.
# A primeira base roda sempre; as demais entram por rodízio, para o run do
# Actions não estourar o tempo (cada base leva ~1-2 min).
sigpub_bases:
  - amp        # PR — prioridade máxima (Maringá)
  - famurs     # RS
  - amupe      # PE
  - agm        # GO
  - aprece     # CE
  - ama        # AL
  - famep      # PA
  - arom       # RO
  - femurn     # RN
  - aam        # AM
  - amr        # RR
  - famup      # PB
  - fgm        # GO (2ª base do estado)
sigpub_extras_por_execucao: 2   # além da primeira; 4 execuções/dia cobrem tudo em ~2 dias

# A FAFIPA saiu daqui: ganhou coletor próprio (fonte "fafipa"), que traz o PDF
# do edital de abertura. Mantê-la nas duas fontes faria o mesmo concurso ser
# coletado duas vezes na mesma execução e o cartão sem edital poderia vencer.
bancas_selecao:
  - https://ameosc.selecao.net.br
  - https://institutoaocp.selecao.net.br
  - https://idecan.selecao.net.br
  - https://fundep.selecao.net.br
  - https://access.selecao.net.br

termos:
  # Homônimos: são MASCARADOS do texto antes de testar a inclusão, então
  # "auditor-fiscal do trabalho" não dispara "auditor fiscal".
  exclusao:
    - auditor fiscal do trabalho
    - fiscal de obras
    - fiscal de postura
    - fiscal de posturas
    - fiscal sanitario
    - fiscal de saude
    - fiscal de vigilancia
    - fiscal de vigilancia sanitaria
    - fiscal de inspecao sanitaria
    - fiscal de inspecao
    - fiscal de meio ambiente
    - fiscal ambiental
    - fiscal de transporte
    - fiscal de transito
    - fiscal de servicos publicos
    - fiscal de defesa do consumidor
    - fiscal agropecuario
    - fiscal federal agropecuario

  # Fisco tributário nas 3 esferas (nomenclaturas confirmadas em editais reais 2019-2026)
  tributario:
    - auditor fiscal
    - auditor de tributos
    - fiscal de tributos
    - fiscal tributario
    - auditor tributario
    - auditor fiscal tributario
    - fiscal de rendas
    - agente fiscal de rendas
    - agente fazendario
    - fiscal fazendario
    - agente de tributos
    - analista de tributos
    - analista tributario
    - tecnico em tributos
    - tecnico de tributos
    - agente de arrecadacao
    - gestor fazendario
    - auditor da receita
    - auditor de rendas

  # Controle externo/interno (TCU, TCEs, CGU, controladorias)
  controle:
    - auditor de controle externo
    - auditor federal de controle externo
    - analista de controle externo
    - tecnico de controle externo
    - auditor de controle interno
    - auditor municipal de controle interno
    - analista de controle interno
    - auditor federal de financas e controle
    - auditor de financas e controle
    - auditor estadual de controle

  # Ambíguos: nunca descartados em silêncio — vão para a seção "conferir" do aviso
  conferir:
    - fiscal municipal
    - agente fiscal
    - controlador interno
    - auditor municipal
    - auditor interno
    - auditor publico

# Consultas usadas nas fontes que buscam por frase (QD e DOU).
# No QD a frase precisa aparecer junto de "concurso público" ou "processo seletivo".
consultas_cargo:
  - auditor fiscal
  - fiscal de tributos
  - auditor de tributos
  - fiscal tributário
  - fiscal de rendas
  - agente fazendário
  - agente de tributos
  - analista tributário
  - auditor de controle externo
  - auditor de controle interno
